<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Mercy Gold Honey">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6E27A"/>
      <stop offset="45%" stop-color="#D4A017"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
    <linearGradient id="amber" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFE9A0"/>
      <stop offset="100%" stop-color="#C4922A"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="64" fill="#FFFBF0"/>
  <!-- honeycomb hex -->
  <path fill="url(#gold)" opacity="0.25" d="M256 48l90 52v104l-90 52-90-52V100z"/>
  <path fill="url(#gold)" opacity="0.18" d="M166 204l90 52v104l-90 52-90-52V256z"/>
  <path fill="url(#gold)" opacity="0.18" d="M346 204l90 52v104l-90 52-90-52V256z"/>
  <!-- honey drop -->
  <path fill="url(#amber)" d="M256 150c0 0-70 95-70 145a70 70 0 0 0 140 0c0-50-70-145-70-145z"/>
  <ellipse cx="256" cy="300" rx="28" ry="18" fill="#FFF3C4" opacity="0.55"/>
  <!-- bee simplified -->
  <ellipse cx="256" cy="210" rx="36" ry="24" fill="#3D2B1F"/>
  <ellipse cx="256" cy="210" rx="36" ry="24" fill="none" stroke="#F6E27A" stroke-width="6"/>
  <path d="M230 210h52" stroke="#F6E27A" stroke-width="5"/>
  <path d="M220 198c-20-18-40-12-48 4" fill="none" stroke="#C8B89A" stroke-width="5" stroke-linecap="round"/>
  <path d="M292 198c20-18 40-12 48 4" fill="none" stroke="#C8B89A" stroke-width="5" stroke-linecap="round"/>
  <!-- wordmark space reserved below for CSS text; monogram -->
  <text x="256" y="430" text-anchor="middle" font-family="Georgia, serif" font-size="36" font-weight="700" fill="#8B6914" letter-spacing="4">MERCY GOLD</text>
  <text x="256" y="468" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#A67C00" letter-spacing="6">HONEY</text>
</svg>
